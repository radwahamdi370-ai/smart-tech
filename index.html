<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق المذاكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: one centered column of soft cards on a pale pink ground; subject cards, then a sticker shelf; the tutor floats as a sheet. */
:root{
  --bg:#fff7fa; --surface:#ffffff; --surface-2:#fff0f5;
  --ink:#3a2431; --muted:#7d6172; --line:#f4d6e3;
  --pink:#c93f79; --pink-deep:#a82f62; --pink-soft:#fde0ec; --on-pink:#ffffff;
  --ok:#1f7a52; --ok-soft:#dff5ea; --bad:#b83b32; --bad-soft:#fde3e0;
  --shadow:0 10px 28px rgba(201,63,121,.10);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1419; --surface:#291b23; --surface-2:#33212c;
    --ink:#fbe9f1; --muted:#c9a3b7; --line:#47303c;
    --pink:#f08fb7; --pink-deep:#ffb3d1; --pink-soft:#4a2638; --on-pink:#2a1220;
    --ok:#6fd6a4; --ok-soft:#1f3a2d; --bad:#ff8c82; --bad-soft:#43231f;
    --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1419; --surface:#291b23; --surface-2:#33212c;
  --ink:#fbe9f1; --muted:#c9a3b7; --line:#47303c;
  --pink:#f08fb7; --pink-deep:#ffb3d1; --pink-soft:#4a2638; --on-pink:#2a1220;
  --ok:#6fd6a4; --ok-soft:#1f3a2d; --bad:#ff8c82; --bad-soft:#43231f;
  --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.75;
  padding-block:0 96px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
h1,h2,h3{font-family:var(--f-display); line-height:1.35; margin:0; text-wrap:balance}
h1{font-size:clamp(1.55rem,4.5vw,2.2rem)} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink); outline-offset:2px; border-radius:8px}
.wrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:20px; min-width:0}
.eyebrow{font-size:.8rem; letter-spacing:.04em; color:var(--pink); font-weight:600}
.muted{color:var(--muted)}

/* top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:14px; border-bottom:1px solid var(--line); margin-bottom:4px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:700; font-size:1.1rem; background:none; border:0; padding:0}
.brand svg{width:34px; height:34px}
.top-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; background:var(--pink-soft); color:var(--pink-deep); font-size:.85rem; font-weight:500; border:0}
.chip.sync::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--muted)}
.chip.sync[data-s="ok"]::before{background:var(--ok)} .chip.sync[data-s="fail"]::before{background:var(--bad)} .chip.sync[data-s="ready"]::before{background:var(--pink)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 22px; border-radius:12px; border:0; background:var(--pink); color:var(--on-pink); font-weight:600; min-height:44px; transition:transform .15s, background .15s}
.btn:hover{background:var(--pink-deep); color:#fff} .btn:active{transform:scale(.98)}
.btn.ghost{background:transparent; color:var(--pink-deep); border:1.5px solid var(--line)} .btn.ghost:hover{background:var(--pink-soft); color:var(--pink-deep)}
.btn.small{padding:6px 14px; min-height:36px; font-size:.9rem}
.link{background:none; border:0; padding:0; color:var(--pink-deep); text-decoration:underline; text-underline-offset:3px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:var(--shadow); min-width:0}

/* login */
.login{max-width:980px; margin:0 auto; display:grid; grid-template-columns:1.1fr 1fr; gap:28px; align-items:center; padding-block:40px; min-height:80vh}
.login-art{background:var(--pink-soft); border-radius:28px; padding:20px; aspect-ratio:1/1; max-height:460px; display:flex}
.login-art svg{width:100%; height:100%}
.login-card{display:flex; flex-direction:column; gap:10px}
.login-card label{font-weight:600; margin-top:8px}
.login-card input,.login-card select{width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); min-height:48px}
.login-card input:focus,.login-card select:focus{border-color:var(--pink); outline:none; box-shadow:0 0 0 3px var(--pink-soft)}
.err{color:var(--bad); min-height:1.5em; font-size:.9rem}
.note{font-size:.85rem; color:var(--muted)}

/* home */
.hero{display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; background:linear-gradient(135deg,var(--pink-soft),var(--surface-2)); border:1px solid var(--line); border-radius:24px; padding:26px}
.hero p{color:var(--muted); margin-top:6px}
.meter{display:flex; flex-direction:column; gap:6px; min-width:180px}
.bar{height:10px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--line)}
.bar>i{display:block; height:100%; background:var(--pink); border-radius:99px; transition:width .5s}
.meter b{font-family:var(--f-display); font-size:1.4rem; color:var(--pink-deep)}
.subjects{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px}
.subject{display:flex; flex-direction:column; gap:12px; text-align:start; cursor:pointer; transition:transform .2s, box-shadow .2s; font:inherit; color:inherit}
.subject:hover{transform:translateY(-3px)}
.subject .ico{width:56px; height:56px; border-radius:16px; background:var(--pink-soft); display:grid; place-items:center}
.subject .ico svg{width:34px; height:34px}
.subject .meta{display:flex; gap:10px; align-items:center; justify-content:space-between; color:var(--muted); font-size:.9rem}
.shelf-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
.stickers{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px}
.sticker{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; background:var(--surface); border:1px dashed var(--line); border-radius:16px; padding:14px 8px; font-size:.85rem}
.sticker svg{width:76px; height:76px}
.sticker.on{border-style:solid; cursor:pointer}
.sticker.lock{color:var(--muted)}
.wiggle svg{animation:wig .6s}
@keyframes wig{20%{transform:rotate(-10deg) scale(1.1)}50%{transform:rotate(8deg) scale(1.15)}80%{transform:rotate(-4deg)}}

/* subject + section */
.crumbs{display:flex; gap:8px; align-items:center; color:var(--muted); font-size:.9rem; flex-wrap:wrap}
.list{display:flex; flex-direction:column; gap:12px; margin:0; padding:0; list-style:none}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; width:100%; text-align:start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; transition:border-color .2s, transform .2s}
.row:hover{border-color:var(--pink); transform:translateX(-3px)}
.num{width:42px; height:42px; border-radius:50%; background:var(--pink-soft); color:var(--pink-deep); display:grid; place-items:center; font-family:var(--f-display); font-weight:700}
.row small{display:block; color:var(--muted)}
.pill{padding:3px 12px; border-radius:99px; font-size:.82rem; font-weight:600; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.pill.done{background:var(--ok-soft); color:var(--ok)}
.pill.try{background:var(--pink-soft); color:var(--pink-deep)}
.res{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.res-btn{display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:16px; background:var(--surface); border:1px solid var(--line); text-decoration:none; color:var(--ink); transition:border-color .2s, transform .2s}
a.res-btn:hover{border-color:var(--pink); transform:translateY(-2px)}
.res-btn .ri{width:46px; height:46px; border-radius:14px; background:var(--pink-soft); display:grid; place-items:center; flex:none}
.res-btn .ri svg{width:24px; height:24px}
.res-btn b{display:block} .res-btn small{color:var(--muted)}
.res-btn.off{opacity:.65; border-style:dashed}
.summary ul{margin:12px 0 0; padding-inline-start:22px; display:flex; flex-direction:column; gap:8px}
.summary li::marker{color:var(--pink)}
pre.code{direction:ltr; text-align:left; margin:16px 0 0; padding:14px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; font-family:var(--f-mono); font-size:.88rem; line-height:1.6; overflow-x:auto}
.pager{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}

/* quiz */
.qhead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.dots{display:flex; gap:6px}
.dots i{width:28px; height:6px; border-radius:99px; background:var(--line)}
.dots i.cur{background:var(--pink)} .dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)}
.q{font-family:var(--f-display); font-size:1.1rem; line-height:1.6; margin-bottom:14px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; gap:12px; align-items:center; text-align:start; width:100%; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg); min-height:50px; transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--pink); background:var(--pink-soft)}
.opt .l{width:30px; height:30px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; flex:none; font-weight:600; font-size:.9rem}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)} .opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.fb{margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line)}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.result{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:6px 0}
.result .score{font-family:var(--f-display); font-size:2.4rem; color:var(--pink-deep)}
.result svg.big{width:120px; height:120px; animation:wig .8s}
.actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px}

/* tutor */
.fab{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); left:max(16px, env(safe-area-inset-left, 0px)); z-index:20; display:flex; align-items:center; gap:10px; padding:8px 18px 8px 10px; border-radius:999px; border:0; background:var(--pink); color:var(--on-pink); box-shadow:0 10px 24px rgba(201,63,121,.35); font-weight:600}
.fab svg{width:38px; height:38px; background:var(--surface); border-radius:50%}
.tutor{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); left:max(16px, env(safe-area-inset-left, 0px)); z-index:30; width:min(400px, calc(100vw - 32px)); height:min(560px, calc(100dvh - 40px)); background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 50px rgba(120,30,70,.28); display:flex; flex-direction:column; overflow:hidden}
.t-head{display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--pink-soft); border-bottom:1px solid var(--line)}
.t-head svg{width:40px; height:40px; background:var(--surface); border-radius:50%}
.t-head div{flex:1; min-width:0} .t-head small{color:var(--muted); display:block; line-height:1.3}
.t-x{border:0; background:var(--surface); width:36px; height:36px; border-radius:50%; font-size:1.2rem; line-height:1}
.t-msgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:0}
.m{max-width:88%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere}
.m.bot{background:var(--surface-2); border:1px solid var(--line); align-self:flex-start; border-start-start-radius:4px}
.m.me{background:var(--pink); color:var(--on-pink); align-self:flex-end; border-start-end-radius:4px}
.m pre.code{margin-top:10px; font-size:.8rem}
.t-chips{display:flex; gap:8px; flex-wrap:wrap; padding:0 14px 10px}
.t-chips button{border:1px solid var(--line); background:var(--bg); border-radius:99px; padding:4px 12px; font-size:.82rem}
.t-chips button:hover{background:var(--pink-soft)}
.t-form{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}
.t-form input{flex:1; min-width:0; padding:10px 14px; border-radius:99px; border:1.5px solid var(--line); background:var(--bg); min-height:44px}
.t-form input:focus{border-color:var(--pink); outline:none}
.toast{position:fixed; top:calc(14px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); z-index:50; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:.9rem; max-width:calc(100vw - 32px)}

@media (max-width:720px){
  .login{grid-template-columns:1fr; padding-block:20px; min-height:0}
  .login-art{max-height:240px; aspect-ratio:auto}
  .hero{grid-template-columns:1fr}
  .row{grid-template-columns:auto 1fr}
  .row .pill{grid-column:2; justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<button class="fab" id="fab" type="button" data-act="tutor-open" hidden aria-label="افتح المعلم الذكي">
  <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="15" fill="#fde0ec" stroke="#c93f79" stroke-width="2"/><circle cx="18.5" cy="27" r="2" fill="#3a2431"/><circle cx="29.5" cy="27" r="2" fill="#3a2431"/><path d="M18.5 33q5.5 4.5 11 0" stroke="#3a2431" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="24,5 42,12 24,19 6,12" fill="#c93f79"/><path d="M13 16v5q11 6 22 0v-5" fill="#a82f62"/></svg>
  المعلم الذكي
</button>

<aside class="tutor" id="tutor" hidden aria-label="المعلم الذكي">
  <div class="t-head">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="15" fill="#fde0ec" stroke="#c93f79" stroke-width="2"/><circle cx="18.5" cy="27" r="2" fill="#3a2431"/><circle cx="29.5" cy="27" r="2" fill="#3a2431"/><path d="M18.5 33q5.5 4.5 11 0" stroke="#3a2431" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="24,5 42,12 24,19 6,12" fill="#c93f79"/><path d="M13 16v5q11 6 22 0v-5" fill="#a82f62"/></svg>
    <div><h3>المعلم الذكي</h3><small>اسألني عن هياكل البيانات والشبكات</small></div>
    <button class="t-x" type="button" data-act="tutor-close" aria-label="إغلاق">×</button>
  </div>
  <div class="t-msgs" id="tmsgs" aria-live="polite"></div>
  <div class="t-chips" id="tchips"></div>
  <form class="t-form" id="tform" autocomplete="off">
    <input id="tin" type="text" placeholder="اكتب سؤالك هنا" aria-label="سؤالك" maxlength="200">
    <button class="btn small" type="submit">إرسال</button>
  </form>
</aside>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

/* ============ 1) الإعدادات: ضع بيانات مشروع Supabase هنا ============ */
const CONFIG = {
  SUPABASE_URL: '',        // مثال: https://xxxx.supabase.co
  SUPABASE_ANON_KEY: ''    // المفتاح العام anon public
};
const YEARS = ['السنة الأولى','السنة الثانية','السنة الثالثة','السنة الرابعة'];
const PASS_MARK = 2; // عدد الإجابات الصحيحة المطلوبة للنجاح من 3

/* ============ 2) المحتوى: عدّل روابط pdf و video لكل جزء ============ */
const SUBJECTS = [
 { id:'ds', title:'هياكل البيانات', en:'Data Structures',
   about:'من تحليل التعقيد إلى المصفوفات والقوائم والمكدس والطابور والأشجار.',
   sections:[
  { id:'ds1', title:'تحليل الخوارزميات وBig-O', pdf:'', video:'',
    summary:['Big-O يصف كيف يزيد زمن التنفيذ أو الذاكرة كلما كبر حجم المدخلات n.',
             'الترتيب من الأسرع إلى الأبطأ: O(1) ثم O(log n) ثم O(n) ثم O(n log n) ثم O(n²).',
             'نتجاهل الثوابت والحدود الصغرى، فالتعبير 3n + 5 يعتبر O(n).'],
    code:'for i in range(n):\n    for j in range(n):\n        work()   # n × n = O(n²)',
    quiz:[
     {q:'ما تعقيد البحث الثنائي في مصفوفة مرتبة؟', o:['O(n)','O(log n)','O(n²)','O(1)'], a:1, e:'في كل خطوة يُستبعد نصف العناصر، فيكون الزمن لوغاريتمياً.'},
     {q:'ما تعقيد الوصول إلى عنصر في مصفوفة عن طريق الفهرس؟', o:['O(1)','O(n)','O(log n)','O(n²)'], a:0, e:'العنوان يُحسب مباشرة من الفهرس، فالزمن ثابت.'},
     {q:'حلقتان متداخلتان، كل واحدة تدور n مرة. ما التعقيد؟', o:['O(n)','O(2n)','O(n²)','O(log n)'], a:2, e:'n × n = n² عملية.'}
    ]},
  { id:'ds2', title:'المصفوفات والقوائم المترابطة', pdf:'', video:'',
    summary:['المصفوفة تخزن عناصرها متجاورة في الذاكرة، فالوصول بالفهرس O(1) لكن الإدراج في المنتصف O(n).',
             'في القائمة المترابطة كل عقدة تحمل قيمة ومؤشراً للعقدة التالية، فالإضافة في البداية O(1) والوصول لعنصر بعينه O(n).',
             'المصفوفة أنسب للقراءة المتكررة، والقائمة أنسب لكثرة الإضافة والحذف.'],
    code:'class Node:\n    def __init__(self, val):\n        self.val = val\n        self.next = None',
    quiz:[
     {q:'أي بنية بيانات تحتاج كل عقدة فيها إلى مؤشر للعقدة التالية؟', o:['المصفوفة','القائمة المترابطة','الجدول الرياضي','المكدس فقط'], a:1, e:'المؤشر next هو الذي يربط العقد ببعضها.'},
     {q:'ما تعقيد إضافة عنصر في بداية قائمة مترابطة؟', o:['O(1)','O(n)','O(log n)','O(n²)'], a:0, e:'ننشئ عقدة جديدة ونجعلها الرأس دون إزاحة أي عنصر.'},
     {q:'ما ميزة المصفوفة على القائمة المترابطة؟', o:['الإضافة في البداية أسرع','حجمها يتغير تلقائياً دائماً','الوصول المباشر بالفهرس','لا تحتاج ذاكرة'], a:2, e:'عناصرها متجاورة، فنصل لأي عنصر في زمن ثابت.'}
    ]},
  { id:'ds3', title:'المكدس والطابور', pdf:'', video:'',
    summary:['المكدس Stack: آخر عنصر يدخل هو أول عنصر يخرج (LIFO). عملياته push وpop وpeek.',
             'الطابور Queue: أول عنصر يدخل هو أول عنصر يخرج (FIFO). عملياته enqueue وdequeue.',
             'المكدس يُستخدم في التراجع Undo واستدعاءات الدوال، والطابور في طوابير الطباعة والمهام.'],

    case 'shield': shape=`<path d="M50 6 88 20V50C88 74 70 88 50 95 30 88 12 74 12 50V20Z" fill="${f}" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>`; break;

    <div class="login-art"><svg viewBox="0 0 300 300" role="img" aria-label="شجرة ثنائية وشبكة صغيرة">
      <g stroke="#c93f79" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M150 50 100 110M150 50 200 110M100 110 70 170M100 110 130 170M200 110 170 170M200 110 230 170"/>
        <path d="M60 250h60M150 250h0M180 250h60" stroke-dasharray="2 9"/>
      </g>
      <g fill="#fff" stroke="#c93f79" stroke-width="3">
        <circle cx="150" cy="50" r="20"/><circle cx="100" cy="110" r="18"/><circle cx="200" cy="110" r="18"/>
        <circle cx="70" cy="170" r="15"/><circle cx="130" cy="170" r="15"/><circle cx="170" cy="170" r="15"/><circle cx="230" cy="170" r="15"/>
      </g>
      <g fill="#c93f79"><circle cx="150" cy="50" r="7"/><circle cx="100" cy="110" r="6"/></g>
      <g fill="#fff" stroke="#c93f79" stroke-width="3"><rect x="30" y="232" width="34" height="34" rx="9"/><rect x="133" y="232" width="34" height="34" rx="9"/><rect x="236" y="232" width="34" height="34" rx="9"/></g>
      <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#a82f62" text-anchor="middle"><text x="47" y="254">PC</text><text x="150" y="254">SW</text><text x="253" y="254">RT</text></g>
    </svg></div>
    <form id="login" class="card login-card" novalidate>
      <p class="eyebrow">مواد الحاسب</p>
      <h1>أهلاً بك في رفيق المذاكرة</h1>
      <p class="muted">اكتب اسمك وسنتك الدراسية، وابدأ شرح هياكل البيانات وشبكات الحاسب مع اختبار بعد كل جزء.</p>
      <label for="name">الاسم</label>
      <input id="name" name="name" autocomplete="name" maxlength="40" placeholder="مثال: سارة أحمد">
      <label for="year">السنة الدراسية</label>
      <select id="year" name="year"><option value="">اختر السنة</option>${YEARS.map(y=>`<option>${y}</option>`).join('')}</select>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">ابدأ المذاكرة</button>
      <p class="note">${sb?'يُحفظ تقدمك في حسابك على Supabase.':'يُحفظ تقدمك على هذا الجهاز. اربط Supabase من قسم الإعدادات في الكود.'}</p>
    </form></main>`;
}
function renderHome(){
  const u=state.data.user, done=totalPassed(), pct=Math.round(done/TOTAL*100), earned=earnedSet();
  const first=u.name.trim().split(/\s+/)[0];
  root.innerHTML=`<div class="wrap">${topbar()}
    <section class="hero">
      <div><p class="eyebrow">${esc(u.year)}</p><h1>أهلاً يا ${esc(first)}</h1>
      <p>${done===0?'اختر مادة وابدأ بأول جزء. بعد كل جزء ستجد اختباراً قصيراً.':'أنجزت '+done+' من '+TOTAL+' أجزاء. كمّل من حيث توقفت.'}</p></div>
      <div class="meter"><b>${pct}%</b><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="muted">${done} / ${TOTAL} أجزاء ناجحة</span></div>
    </section>
    <section aria-labelledby="h-sub"><h2 id="h-sub" style="margin-bottom:14px">المواد الدراسية</h2>
      <div class="subjects">${SUBJECTS.map(s=>`<button type="button" class="card subject" data-act="subject" data-id="${s.id}">
        <span class="ico">${ICO[s.id]}</span>
        <div><h3>${s.title}</h3><p class="muted" dir="ltr" style="text-align:start;font-size:.85rem">${s.en}</p></div>
        <p>${s.about}</p>
        <div class="meta"><span>${s.sections.length} أجزاء · PDF وفيديو واختبار</span><span class="pill ${passedCount(s)===s.sections.length?'done':''}">${passedCount(s)} / ${s.sections.length}</span></div>
      </button>`).join('')}</div></section>
    <section aria-labelledby="h-st">
      <div class="shelf-head"><h2 id="h-st">ملصقاتك</h2><span class="muted">${earned.size} من ${STICKERS.length}. ينال كل جزء ملصقاً عند النجاح في اختباره.</span></div>
      <div class="stickers" style="margin-top:14px">${STICKERS.map(st=>{const on=earned.has(st.id); return `<button type="button" class="sticker ${on?'on':'lock'}" data-act="sticker" data-id="${st.id}" ${on?'':'aria-disabled="true"'}>${stickerSVG(st,on)}<span>${on?st.name:'مقفل'}</span></button>`;}).join('')}</div>
    </section></div>`;
}
function renderSubject(id){
  const sub=SUBJECTS.find(s=>s.id===id);
  root.innerHTML=`<div class="wrap">${topbar()}
    <nav class="crumbs"><button class="link" type="button" data-act="home">الرئيسية</button><span>/</span><span>${sub.title}</span></nav>
    <header><p class="eyebrow">${sub.en}</p><h1>${sub.title}</h1><p class="muted" style="margin-top:6px">${sub.about}</p></header>
    <ol class="list">${sub.sections.map((s,i)=>{const p=P()[s.id]; const st=p&&p.passed?'<span class="pill done">ناجح '+p.best+'/'+p.total+'</span>':p?'<span class="pill try">أعد المحاولة '+p.best+'/'+p.total+'</span>':'<span class="pill">لم يبدأ</span>'; return `<li><button type="button" class="row" data-act="section" data-id="${s.id}"><span class="num">${i+1}</span><span><b>${s.title}</b><small>ملخص · PDF · فيديو · اختبار ${s.quiz.length} أسئلة</small></span>${st}</button></li>`;}).join('')}</ol></div>`;
}
function resBtn(url,kind,label,sub){
  const inner=`<span class="ri">${ICO[kind]}</span><span><b>${label}</b><small>${url?sub:'سيُضاف الرابط قريباً'}</small></span>`;
  return url?`<a class="res-btn" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>`:`<span class="res-btn off" aria-disabled="true">${inner}</span>`;
}
function renderSection(id){
  const {sub,sec,i}=sectionOf(id), prev=sub.sections[i-1], next=sub.sections[i+1];
  root.innerHTML=`<div class="wrap">${topbar()}
    <nav class="crumbs"><button class="link" type="button" data-act="home">الرئيسية</button><span>/</span><button class="link" type="button" data-act="subject" data-id="${sub.id}">${sub.title}</button></nav>
    <header><p class="eyebrow">الجزء ${i+1} من ${sub.sections.length}</p><h1>${sec.title}</h1></header>
    <section class="res" aria-label="مصادر الجزء">${resBtn(sec.pdf,'pdf','ملف PDF','افتح الملف')}${resBtn(sec.video,'video','فيديو الشرح','شاهد الآن')}</section>
    <section class="card summary"><h2>ملخص سريع</h2><ul>${sec.summary.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${sec.code?`<pre class="code">${esc(sec.code)}</pre>`:''}</section>
    <section class="card" aria-labelledby="h-q"><h2 id="h-q" style="margin-bottom:12px">اختبر نفسك</h2><div id="quiz"></div></section>
    <div class="pager">${prev?`<button class="btn ghost" type="button" data-act="section" data-id="${prev.id}">الجزء السابق</button>`:'<span></span>'}${next?`<button class="btn ghost" type="button" data-act="section" data-id="${next.id}">الجزء التالي</button>`:`<button class="btn ghost" type="button" data-act="subject" data-id="${sub.id}">كل الأجزاء</button>`}</div></div>`;
  state.quiz=null; renderQuiz();
}
function renderQuiz(){
  const box=$('#quiz'); if(!box) return;
  const {sub,sec,i}=sectionOf(state.view.id); const q=state.quiz;
  if(!q){
    const p=P()[sec.id];
    box.innerHTML=`<p>${sec.quiz.length} أسئلة اختيار من متعدد. يلزمك ${PASS_MARK} إجابات صحيحة لتنال ملصق الجزء.</p>${p?`<p class="muted">أفضل نتيجة لك: ${p.best} من ${p.total}</p>`:''}<div class="actions" style="justify-content:flex-start"><button class="btn" type="button" data-act="quiz-start">${p?'أعد الاختبار':'ابدأ الاختبار'}</button></div>`;
    return;
  }
  if(q.done){
    const passed=q.score>=PASS_MARK, st=STICKERS.find(s=>s.sec===sec.id);
    const subDone=passed&&passedCount(sub)===sub.sections.length, subSt=STICKERS.find(s=>s.id==='sub-'+sub.id);
    box.innerHTML=`<div class="result"><span class="score">${q.score} / ${q.items.length}</span>
      <p><b>${passed?'أحسنت، نجحت في هذا الجزء':'قريب جداً، راجع الملخص وحاول مرة أخرى'}</b></p>
      ${passed?stickerSVG(st,true,'big')+`<p>حصلت على ملصق «${st.name}»</p>`:''}
      ${subDone&&q.firstFinish?`<p class="chip">أنهيت كل أجزاء ${sub.title}، وحصلت على «${subSt.name}»</p>`:''}
      <div class="actions"><button class="btn ghost" type="button" data-act="quiz-start">أعد الاختبار</button>${sub.sections[i+1]?`<button class="btn" type="button" data-act="section" data-id="${sub.sections[i+1].id}">الجزء التالي</button>`:`<button class="btn" type="button" data-act="home">إلى الرئيسية</button>`}</div></div>`;
    return;
  }
  const it=q.items[q.i], L=['أ','ب','ج','د'];
  box.innerHTML=`<div class="qhead"><span class="muted">السؤال ${q.i+1} من ${q.items.length}</span><div class="dots">${q.items.map((x,k)=>`<i class="${k===q.i?'cur':x.res===true?'ok':x.res===false?'bad':''}"></i>`).join('')}</div></div>
    <p class="q">${esc(it.q)}</p>
    <div class="opts">${it.o.map((o,k)=>{ let c=''; if(q.picked!==null){ if(o.ok) c='ok'; else if(k===q.picked) c='bad'; } return `<button type="button" class="opt ${c}" data-act="pick" data-i="${k}" ${q.picked!==null?'disabled':''}><span class="l">${L[k]}</span><span>${esc(o.t)}</span></button>`; }).join('')}</div>
    ${q.picked!==null?`<div class="fb" role="status"><b class="${it.res?'ok':'bad'}">${it.res?'إجابة صحيحة':'إجابة غير صحيحة'}</b><p>${esc(it.e)}</p></div><div class="actions" style="justify-content:flex-start"><button class="btn" type="button" data-act="quiz-next">${q.i+1<q.items.length?'السؤال التالي':'شاهد النتيجة'}</button></div>`:''}`;
}
function render(){
  const u=state.data.user, v=state.view;
  if(!u) renderLogin();
  else if(v.name==='subject') renderSubject(v.id);
  else if(v.name==='section') renderSection(v.id);
  else renderHome();
  $('#fab').hidden=!u||!$('#tutor').hidden;
  if(!u) $('#tutor').hidden=true;
  window.scrollTo(0,0);
}
function go(name,id){ state.view={name,id}; render(); }

/* ============ الاختبار ============ */
function startQuiz(){
  const {sec}=sectionOf(state.view.id);
  state.quiz={i:0,score:0,picked:null,done:false,items:sec.quiz.map(q=>({q:q.q,e:q.e,res:null,o:shuffle(q.o.map((t,k)=>({t,ok:k===q.a})))}))};
  renderQuiz();
}
function pick(k){
  const q=state.quiz; if(q.picked!==null) return;
  const it=q.items[q.i]; q.picked=k; it.res=!!it.o[k].ok; if(it.res) q.score++; renderQuiz();
}
function nextQ(){
  const q=state.quiz;
  if(q.i+1<q.items.length){ q.i++; q.picked=null; renderQuiz(); return; }
  q.done=true;
  const {sec}=sectionOf(state.view.id), old=P()[sec.id], passed=q.score>=PASS_MARK;
  const wasPassed=!!(old&&old.passed);
  P()[sec.id]={best:Math.max(q.score,old?old.best:0), total:q.items.length, passed:wasPassed||passed, attempts:(old?old.attempts:0)+1};
  q.firstFinish=passed;
  save(); renderQuiz();
  const u=state.data.user;
  remote(c=>c.from('quiz_results').insert({student_id:u.id, section_id:sec.id, score:q.score, total:q.items.length}));
}

/* ============ المعلم الذكي ============ */
const norm = s=>String(s).toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function answer(text){
  const q=norm(text), tokens=q.split(/[^a-z0-9()]+/).filter(Boolean);
  let best=null, score=0;
  KB.forEach(e=>{ let s=0; e.k.forEach(key=>{ const k=norm(key); const latin=/^[a-z0-9()-]+$/.test(k); if(latin?tokens.includes(k):q.includes(k)) s+=k.length; }); if(s>score){score=s; best=e;} });
  return best;
}
function say(role,text,code){
  const m=document.createElement('div'); m.className='m '+role; m.textContent=text;
  if(code){ const p=document.createElement('pre'); p.className='code'; p.textContent=code; m.appendChild(p); }
  const box=$('#tmsgs'); box.appendChild(m); box.scrollTop=box.scrollHeight;
}
function ask(text){
  text=text.trim(); if(!text) return; say('me',text);
  setTimeout(()=>{
    const e=answer(text);
    if(e) say('bot',e.a,e.code);
    else say('bot','لم أجد إجابة مناسبة لهذا السؤال بعد. جرّب أن تذكر اسم الموضوع مباشرة، مثل: المكدس، الشجرة، OSI، Subnetting أو DNS.');
  },350);
}
function tutorOpen(o){
  $('#tutor').hidden=!o; $('#fab').hidden=o||!state.data.user;
  if(o){
    if(!$('#tmsgs').children.length){ const n=state.data.user?state.data.user.name.trim().split(/\s+/)[0]:''; say('bot','أهلاً '+n+'! أنا المعلم الذكي. اسألني عن أي موضوع في هياكل البيانات أو الشبكات.'); }
    $('#tin').focus();
  }
}
$('#tchips').innerHTML=CHIPS.map(c=>`<button type="button" data-act="chip">${c}</button>`).join('');

/* ============ الأحداث ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  switch(a){
    case 'home': go('home'); break;
    case 'subject': go('subject',id); break;
    case 'section': go('section',id); break;
    case 'logout': state.data.user=null; save(); tutorOpen(false); $('#tmsgs').innerHTML=''; state.view={name:'home'}; render(); break;
    case 'quiz-start': startQuiz(); break;
    case 'pick': pick(+el.dataset.i); break;
    case 'quiz-next': nextQ(); break;
    case 'sticker': { const st=STICKERS.find(s=>s.id===id); if(earnedSet().has(id)){ el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); toast(st.name); } else toast('انجح في الاختبار المرتبط لتفتح هذا الملصق'); break; }
    case 'tutor-open': tutorOpen(true); break;
    case 'tutor-close': tutorOpen(false); break;
    case 'chip': ask(el.textContent); break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='login'){
    const name=$('#name').value.trim(), year=$('#year').value, err=$('#err');
    if(name.length<2){ err.textContent='اكتب اسمك (حرفان على الأقل).'; $('#name').focus(); return; }
    if(!year){ err.textContent='اختر السنة الدراسية.'; $('#year').focus(); return; }
    state.data.user={id:uid(),name,year}; save();
    remote(c=>c.from('students').upsert({id:state.data.user.id,name,year}));
    state.view={name:'home'}; render();
  } else if(e.target.id==='tform'){
    const i=$('#tin'); const v=i.value; i.value=''; ask(v);
  }
});
render();
})();
</script>
